server:
    port: 8080

spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
    jackson:
        serialization:
            WRITE_DATES_AS_TIMESTAMPS: false

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics

external:
    driver-service:
        base-url: ${EXTERNAL_DRIVER_SERVICE_BASE_URL}
        enabled: ${EXTERNAL_DRIVER_SERVICE_ENABLED}
